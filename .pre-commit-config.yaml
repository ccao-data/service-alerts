repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.49
    hooks:
      - id: ty
        args: [--frozen, --all-extras]

  - repo: local
    hooks:
      - id: validate-alert-configs
        name: validate alert config files
        entry: uv run python -m alerts.validate
        language: system
        files: ^config/.*\.ya?ml$
        pass_filenames: true
