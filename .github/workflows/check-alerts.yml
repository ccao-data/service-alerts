name: check-alerts

on:
  schedule:
    - cron: "0 * * * *"  # Run at the top of every hour
  workflow_dispatch:  # Allow manual runs for testing

env:
  PYTHONUNBUFFERED: "1"
  UV_FROZEN: 1

jobs:
  check-alerts:
    name: Check alerts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Mask sensitive identifiers from logs
        shell: bash
        run: echo "::add-mask::${{ secrets.AWS_ACCOUNT_ID }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_TO_ASSUME_ARN }}
          role-duration-seconds: 900

      - name: Run alert checks
        shell: bash
        run: uv run python scripts/check_alerts.py alerts/*.yml
