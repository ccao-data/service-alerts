alerts:
  - id: ic-reference-file-not-run
    name: "IC reference file export not run"
    log_group: /ccao/jobs/ic-reference-file
    log_query: "?info ?Info ?INFO"
    fail_if: "no_match"
    schedule: "0 12 * * *"
    lookback_hours: 12
    aws_sns_topic: ccao-cloudwatch-alarm
    failure_message: >-
      The job that exports the IC reference file did not run as expected.
      The IC reference file may be out of date or missing. See the CloudWatch
      logs for details:
      https://us-east-1.console.aws.amazon.com/cloudwatch/home?region=us-east-1#logsV2:log-groups/log-group/$252Fccao$252Fjobs$252Fic_reference_file_export

  - id: ic-reference-file-error
    name: "IC reference file export error"
    log_group: /ccao/jobs/ic-reference-file
    log_query: "?error ?Error ?ERROR ?exception ?Exception ?EXCEPTION"
    fail_if: "match"
    schedule: "0 12 * * *"
    lookback_hours: 12
    aws_sns_topic: ccao-cloudwatch-alarm
    failure_message: >-
      The job that exports the IC reference file encountered an unexpected
      error. The IC reference file may be out of date or missing. See the
      CloudWatch logs for details:
      https://us-east-1.console.aws.amazon.com/cloudwatch/home?region=us-east-1#logsV2:log-groups/log-group/$252Fccao$252Fjobs$252Fic_reference_file_export
