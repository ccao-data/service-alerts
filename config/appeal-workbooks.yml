alerts:
  - id: service-appeal-worbooks-not-run
    name: "Appeal Workbooks Did Not Run"
    log_group: /ccao/jobs/appeal_workbooks
    log_query: "?info ?Info ?INFO"
    fail_if: "no_match"
    schedule: "0 12 * * *"
    lookback_hours: 12
    aws_sns_topic: ccao-cloudwatch-alarm
    failure_message: >-
      The nightly writing of the appeal workbooks did not run.
      See the CloudWatch logs for details:
      https://us-east-1.console.aws.amazon.com/cloudwatch/home?region=us-east-1#logsV2:log-groups/log-group/$252Fccao$252Fjobs$252Fappeal_workbooks
