alerts:
  - name: "Spark ingest not run"
    log_group: /ccao/jobs/spark
    log_query: "info"
    error_if: "no_match"
    schedule: "0 12 * * *"
    lookback_hours: 12

  - name: "Spark ingest error"
    log_group: /ccao/jobs/spark
    log_query: "error"
    error_if: "match"
    schedule: "0 12 * * *"
    lookback_hours: 12
