[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alerts"
version = "0.1.0"
description = "Workflow and config files for checking that scheduled jobs are running as expected"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "croniter>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = ["I"]
